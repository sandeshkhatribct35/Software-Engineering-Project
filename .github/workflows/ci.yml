name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, test and coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fairshare
          POSTGRES_PASSWORD: fairshare
          POSTGRES_DB: fairshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairshare -d fairshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://fairshare:fairshare@localhost:5432/fairshare_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests with coverage
        # The coverage gate fails the build below 90% (GUIDE T-2).
        run: |
          pytest --cov=app \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-report=html \
                 --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  docker:
    name: Build the image and smoke-test the stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t fairshare-api:ci .

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the API to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:8000/ > /dev/null; then
              echo "API responded after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"
          docker compose logs
          exit 1

      - name: Exercise the API inside Docker
        run: |
          curl -fs -X POST http://localhost:8000/api/v1/groups \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke test"}'
          curl -fs http://localhost:8000/api/v1/groups

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
