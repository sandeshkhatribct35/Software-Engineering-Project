[project]
name = "fairshare-api"
version = "1.0.0"
description = "Group expense sharing and settlement REST API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes   I  import order      B   likely bugs
# UP   modern syntax            SIM simplification   C4  comprehensions
# ARG  unused arguments
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are declared as parameters even when only their side effect matters.
"tests/**" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises the API end to end and requires a PostgreSQL database",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
